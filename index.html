<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowchart Lab — Sugiyama layout workbench</title>
<meta name="description" content="A Sugiyama-pipeline flowchart layout engine you can take apart: swap the layering algorithm, watch the crossing count move, compare the result against mermaid, export to draw.io or Office.">
<meta name="theme-color" content="#14181d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%2314181d'/%3E%3Crect x='6' y='2' width='6' height='4' fill='none' stroke='%234d9fe8' stroke-width='1.6'/%3E%3Crect x='1' y='12' width='6' height='4' fill='none' stroke='%2378828e' stroke-width='1.6'/%3E%3Crect x='11' y='12' width='6' height='4' fill='none' stroke='%2378828e' stroke-width='1.6'/%3E%3Cpath d='M9 6v3H4v3M9 9h5v3' fill='none' stroke='%23d99a2b' stroke-width='1.6'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="Flowchart Lab">
<meta property="og:description" content="A Sugiyama-pipeline flowchart layout engine you can take apart, side by side with mermaid.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">
</head>
<body>

<header>
  <span class="mark">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <rect x="6" y="1" width="6" height="4" fill="none" stroke="#4d9fe8" stroke-width="1.3"/>
      <rect x="1" y="13" width="6" height="4" fill="none" stroke="#78828e" stroke-width="1.3"/>
      <rect x="11" y="13" width="6" height="4" fill="none" stroke="#78828e" stroke-width="1.3"/>
      <path d="M9 5v4H4v4M9 9h5v4" fill="none" stroke="#d99a2b" stroke-width="1.3"/>
    </svg>
    Flowchart Lab <small>· Sugiyama workbench</small>
  </span>
  <span class="siblings">
    <a href="index.html" class="on">Sugiyama lab</a>
    <a href="sgd.html">Stress lab</a>
  </span>
  <span class="spacer"></span>
  <span class="exports">
    <button id="ex-drawio" class="primary" title="draw.io XML on the clipboard — paste into diagrams.net via Extras &gt; Edit Diagram">copy .drawio</button>
    <button id="ex-office" title="Flat SVG on the clipboard — paste into PowerPoint, then Convert to Shape">copy .svg for Office</button>
    <button id="ex-svg" title="Styled SVG on the clipboard, for the web">copy .svg</button>
  </span>
</header>

<main>
  <section class="side">
    <div class="side-head">
      <span>source</span>
      <select id="preset" title="Load an example">
        <option value="approval">approval flow</option>
        <option value="chain">long chain (wrap demo)</option>
        <option value="crossy">crossing stress</option>
        <option value="state">retry state machine</option>
        <option value="wide">wide fan</option>
        <option value="incident">very long: incident response</option>
      </select>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="src" spellcheck="false" aria-label="Flowchart source"></textarea>
    </div>
    <div class="errbar" id="err"></div>

    <div class="controls">
      <div class="grp">
        <h4>pipeline</h4>
        <div class="row">
          <label for="layering">layering</label>
          <select id="layering">
            <option value="network-simplex">network simplex</option>
            <option value="longest-path">longest path</option>
            <option value="coffman-graham">coffman-graham</option>
          </select>
        </div>
        <div class="row" id="cgrow" style="display:none">
          <label for="cgw">max width</label>
          <input type="number" id="cgw" min="1" max="12" value="4">
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="promote" checked> node promotion</label>
        </div>
        <div class="row">
          <label for="iters">order passes</label>
          <input type="range" id="iters" min="0" max="40" value="24">
          <span class="val" id="itersv">24</span>
        </div>
        <p class="effect" id="fx-layering"></p>
        <p class="effect" id="fx-iters"></p>
      </div>

      <div class="grp">
        <h4>shape</h4>
        <div class="row">
          <label for="dir">direction</label>
          <select id="dir">
            <option value="">from source</option>
            <option value="TB">top to bottom</option>
            <option value="LR">left to right</option>
            <option value="BT">bottom to top</option>
            <option value="RL">right to left</option>
          </select>
        </div>
        <div class="row">
          <label for="routing">edge routing</label>
          <select id="routing">
            <option value="orthogonal">orthogonal</option>
            <option value="polyline">polyline</option>
            <option value="spline">spline</option>
          </select>
        </div>
        <div class="row"><label for="nodeSep">node gap</label>
          <input type="range" id="nodeSep" min="16" max="120" value="44"><span class="val" id="nodeSepv">44</span></div>
        <div class="row"><label for="rankSep">rank gap</label>
          <input type="range" id="rankSep" min="24" max="160" value="56"><span class="val" id="rankSepv">56</span></div>
        <p class="effect" id="fx-routing"></p>
      </div>

      <div class="grp">
        <h4>wrapping</h4>
        <div class="row">
          <label class="check"><input type="checkbox" id="wrap"> cut and stack</label>
        </div>
        <div class="row">
          <label for="ar">target ratio</label>
          <input type="range" id="ar" min="0.4" max="4" step="0.1" value="1.6">
          <span class="val" id="arv">1.6</span>
        </div>
        <p class="effect" id="fx-wrap"></p>
      </div>
    </div>
  </section>

  <section class="stage">
    <div class="stage-head">
      <label for="engine" style="color:var(--dim)">compare with</label>
      <select id="engine" style="font-size:11px; padding:3px 6px">
        <option value="none">nothing</option>
        <option value="mermaid">mermaid (dagre)</option>
        <option value="mermaid-elk">mermaid (ELK)</option>
      </select>
      <span id="cmpstat" style="color:var(--dim)"></span>
      <span class="spacer"></span>
      <span id="zoomlabel">100%</span>
      <button class="zoombtn" id="zin">+</button>
      <button class="zoombtn" id="zout">−</button>
      <button class="zoombtn" id="zfit">fit</button>
    </div>
    <div class="panes">
      <div class="pane">
        <span class="pane-tag" id="tag-a">this engine</span>
        <div id="canvas" tabindex="0" role="img" aria-label="Rendered flowchart"></div>
      </div>
      <div class="pane" id="compare">
        <span class="pane-tag" id="tag-b">mermaid</span>
        <div id="cmpview"></div>
      </div>
    </div>
    <div class="readout" id="readout"></div>
  </section>
</main>


<script src="engine.js"></script>
<script src="exporters.js"></script>
<script src="lab-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
