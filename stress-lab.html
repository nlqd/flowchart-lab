<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress Lab — SGD layout workbench</title>
<meta name="description" content="Graph layout by stochastic gradient descent on the stress objective, after Zheng, Pawar and Goodman, with a constraint layer for rectangles and flow direction, side by side with the Sugiyama engine.">
<meta name="theme-color" content="#14181d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%2314181d'/%3E%3Cpath d='M2 15C6 15 5 4 9 4s3 11 7 11' fill='none' stroke='%235fb37a' stroke-width='1.7' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='4' r='1.8' fill='%23d99a2b'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="Stress Lab">
<meta property="og:description" content="Stress layout by stochastic gradient descent, side by side with a Sugiyama pipeline.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* lab.css */
:root{
  --graphite:#14181d; --slate:#1b2129; --panel:#212932; --panel-hi:#28313c;
  --rule:#2f3844; --rule-hi:#414c5c;
  --vellum:#f4f2ed; --ink:#161a1f;
  --dim:#78828e; --mid:#a7b0bb; --bright:#e4e8ed;
  --signal:#4d9fe8; --trace:#d99a2b; --good:#5fb37a; --bad:#d97070;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--graphite); color:var(--mid);
  font-family:var(--mono); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:grid; grid-template-rows:auto minmax(0,1fr);
}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; gap:18px; padding:0 16px; height:52px;
  border-bottom:1px solid var(--rule); background:var(--slate);
}
.mark{display:flex; align-items:center; gap:9px; color:var(--bright); font-weight:600; letter-spacing:.01em}
.mark svg{display:block}
.mark small{color:var(--dim); font-weight:400; letter-spacing:.02em}
.spacer{flex:1}
.exports{display:flex; gap:6px; flex-wrap:wrap}

button, select, input[type=number]{
  font-family:var(--mono); font-size:12px; color:var(--mid);
  background:var(--panel); border:1px solid var(--rule-hi); border-radius:4px;
  padding:6px 10px; cursor:pointer; transition:background .12s, border-color .12s, color .12s;
}
button:hover, select:hover{background:var(--panel-hi); color:var(--bright); border-color:#4e5a6b}
button:active{transform:translateY(1px)}
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible{
  outline:2px solid var(--signal); outline-offset:1px;
}
button.primary{border-color:#2f5f8c; color:#bcdcfa; background:#1c2c3c}
button.primary:hover{background:#23384c; color:#e2f0ff}
select{padding-right:6px}

/* ---------- main ---------- */
main{display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); min-height:0}

/* ---------- left ---------- */
.side{display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--rule); background:var(--slate)}
.side-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 12px; border-bottom:1px solid var(--rule);
  font-size:11px; letter-spacing:.08em; color:var(--dim);
}
.editor-wrap{position:relative; display:flex; min-height:140px; flex:1 1 auto; overflow:hidden}
.gutter{
  padding:12px 6px 12px 10px; text-align:right; color:#4b5563; background:var(--graphite);
  font-size:12px; line-height:19px; user-select:none; overflow:hidden; border-right:1px solid var(--rule);
  white-space:pre;
  min-width:38px;
}
textarea#src{
  flex:1; resize:none; border:0; outline:none; padding:12px 12px 12px 10px;
  background:var(--graphite); color:#d3dae2; caret-color:var(--signal);
  font-family:var(--mono); font-size:12.5px; line-height:19px; tab-size:2;
  overflow:auto; white-space:pre; scrollbar-width:thin;
}
.errbar{
  padding:7px 12px; font-size:11.5px; color:#f0b4b4; background:#2a1c1c;
  border-top:1px solid #4a2a2a; display:none; white-space:pre-wrap;
}
.errbar.on{display:block}

.controls{border-top:1px solid var(--rule); overflow-y:auto; flex:0 0 auto; max-height:46%}
.grp{padding:10px 12px; border-bottom:1px solid var(--rule)}
.grp h4{margin:0 0 8px; font-size:10.5px; letter-spacing:.1em; color:var(--dim); font-weight:500}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px}
.row:last-child{margin-bottom:0}
.row label{font-size:12px; color:var(--mid); flex:0 0 auto}
.row select, .row input[type=number]{flex:1 1 auto; min-width:0; max-width:190px}
.row input[type=number]{max-width:82px; cursor:text}
input[type=range]{flex:1; accent-color:var(--signal); min-width:0}
.val{font-size:11.5px; color:var(--trace); min-width:34px; text-align:right}
.check{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; color:var(--mid)}
.check input{accent-color:var(--signal); cursor:pointer; margin:0}
.hint{font-size:11px; color:var(--dim); line-height:1.55; margin:8px 0 0}
.hint code{color:var(--mid); background:var(--panel); padding:1px 4px; border-radius:3px; font-size:10.5px}

/* ---------- canvas ---------- */
.stage{display:flex; flex-direction:column; min-width:0; min-height:320px; background:var(--graphite)}
.panes{flex:1; display:flex; min-height:0}
.pane{flex:1; min-width:0; position:relative; display:flex; flex-direction:column}
.pane + .pane{border-left:1px solid var(--rule)}
.pane-tag{
  position:absolute; top:8px; left:8px; z-index:3; pointer-events:none;
  font-size:10px; letter-spacing:.08em; color:#5c6672;
  background:rgba(244,242,237,.86); border:1px solid #d9d5cb; border-radius:3px; padding:2px 7px;
}
#compare{display:none}
#compare.on{display:flex}
#cmpview{
  flex:1; min-height:0; overflow:hidden; background:var(--vellum); position:relative;
  background-image:radial-gradient(#d6d2c8 1px, transparent 1px); background-size:22px 22px;
}
#cmpview svg{width:100%; height:100%; display:block}
.cmp-msg{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px; color:#6a7480; font-size:12px; line-height:1.7;
}
.cmp-msg b{color:#3f4650; font-weight:500; display:block; margin-bottom:6px}
.effect{
  font-size:10.5px; color:var(--trace); margin:-2px 0 8px; line-height:1.5;
  padding-left:1px; min-height:15px;
}
.nochange{color:var(--dim)}
.stage-head{
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  border-bottom:1px solid var(--rule); font-size:11px; color:var(--dim);
}
.stage-head .spacer{flex:1}
.zoombtn{padding:4px 9px; font-size:11px}
#canvas{
  flex:1; min-height:240px; overflow:hidden; position:relative;
  background:var(--vellum); cursor:grab;
  background-image:radial-gradient(#d6d2c8 1px, transparent 1px);
  background-size:22px 22px;
}
#canvas.drag{cursor:grabbing}
#canvas svg{position:absolute; top:0; left:0; width:100%; height:100%}
.fl-node, .fl-edge{transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .16s linear}
.fl-node:hover > :first-child{stroke-width:2.4}

/* ---------- readout: the instrument strip ---------- */
.readout{
  display:flex; align-items:stretch; gap:0; border-top:1px solid var(--rule);
  background:var(--slate); overflow-x:auto; scrollbar-width:thin;
}
.metric{
  padding:8px 14px; border-right:1px solid var(--rule); min-width:88px; flex:0 0 auto;
}
.metric .k{font-size:10px; letter-spacing:.09em; color:var(--dim); display:block}
.metric .v{font-size:16px; color:var(--bright); font-weight:500; letter-spacing:-.01em}
.metric .d{font-size:10.5px; margin-left:5px; opacity:0; transition:opacity .3s}
.metric .d.on{opacity:1}
.d.up{color:var(--bad)} .d.down{color:var(--good)} .d.flat{color:var(--dim)}
.metric.lead{border-left:2px solid var(--signal)}

@media (max-width:880px){
  main{grid-template-columns:1fr; grid-template-rows:minmax(200px,40%) minmax(0,1fr)}
  .side{border-right:0; border-bottom:1px solid var(--rule)}
  .controls{max-height:none}
  header{height:auto; flex-wrap:wrap; padding:10px 12px; gap:10px}
}
@media (prefers-reduced-motion:reduce){
  .fl-node,.fl-edge,.metric .d{transition:none}
}

/* header links between the two workbenches */
.siblings{display:flex; gap:8px; align-items:center}
.siblings a{color:var(--dim); text-decoration:none; font-size:12px; border-bottom:1px solid transparent}
.siblings a:hover{color:var(--bright); border-color:var(--rule-hi)}
.siblings a.on{color:var(--bright); border-color:var(--signal)}
</style>
<style>
/* convergence trace: the one thing this engine can show that a layered pipeline cannot */
.trace{padding:10px 12px; border-top:1px solid var(--rule); background:var(--slate)}
.trace-head{display:flex; align-items:baseline; gap:8px; margin-bottom:7px}
.trace-head b{font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
.trace-head span{font-size:11px; color:var(--dim)}
#spark{display:block; width:100%; height:56px}
</style>
</head>
<body>

<header>
  <span class="mark">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M1 15C5 15 4 4 9 4s4 11 8 11" fill="none" stroke="#5fb37a" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="9" cy="4" r="1.6" fill="#d99a2b"/>
    </svg>
    Stress Lab <small>· SGD workbench</small>
  </span>
  <span class="siblings">
    <a href="https://nlqd.github.io/flowchart-lab/index.html">Sugiyama lab</a>
    <a href="https://nlqd.github.io/flowchart-lab/sgd.html" class="on">Stress lab</a>
  </span>
  <span class="spacer"></span>
  <span class="exports">
    <button id="ex-drawio" class="primary" title="draw.io XML on the clipboard — paste into diagrams.net via Extras &gt; Edit Diagram">copy .drawio</button>
    <button id="ex-office" title="Flat SVG on the clipboard — paste into PowerPoint, then Convert to Shape">copy .svg for Office</button>
    <button id="ex-svg" title="Styled SVG on the clipboard, for the web">copy .svg</button>
  </span>
</header>

<main>
  <section class="side">
    <div class="side-head">
      <span>source</span>
      <select id="preset" title="Load an example">
        <option value="approval">approval flow</option>
        <option value="chain">long chain</option>
        <option value="crossy">crossing stress</option>
        <option value="state">retry state machine</option>
        <option value="wide">wide fan</option>
        <option value="incident">very long: incident response</option>
      </select>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="src" spellcheck="false" aria-label="Flowchart source"></textarea>
    </div>
    <div class="errbar" id="err"></div>

    <div class="controls">
      <div class="grp">
        <h4>optimiser</h4>
        <div class="row">
          <label for="optimiser">method</label>
          <select id="optimiser">
            <option value="sgd">stress / SGD</option>
            <option value="majorization">stress / majorization</option>
            <option value="fr">fruchterman-reingold</option>
            <option value="snap">SNAP-tFDP</option>
          </select>
        </div>
        <div class="row">
          <label for="epochs">epochs</label>
          <input type="range" id="epochs" min="1" max="80" value="30">
          <span class="val" id="epochsv">30</span>
        </div>
        <div class="row">
          <label for="edgeLength">hop length</label>
          <input type="range" id="edgeLength" min="40" max="220" value="110">
          <span class="val" id="edgeLengthv">110</span>
        </div>
        <div class="row">
          <label for="seed">seed</label>
          <input type="range" id="seed" min="1" max="40" value="1">
          <span class="val" id="seedv">1</span>
        </div>
        <p class="effect" id="fx-optimiser"></p>
        <p class="effect" id="fx-epochs"></p>
        <p class="effect" id="fx-seed"></p>
      </div>

      <div class="grp">
        <h4>constraints</h4>
        <div class="row">
          <label for="flow">flow direction</label>
          <select id="flow">
            <option value="none">none (pure stress)</option>
            <option value="TB" selected>top to bottom</option>
            <option value="LR">left to right</option>
          </select>
        </div>
        <div class="row">
          <label for="flowGap">flow gap</label>
          <input type="range" id="flowGap" min="20" max="160" value="70">
          <span class="val" id="flowGapv">70</span>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="align" checked> straighten chains</label>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="noOverlap" checked> separate boxes</label>
        </div>
        <div class="row">
          <label for="overlapPad">box gap</label>
          <input type="range" id="overlapPad" min="0" max="48" value="10">
          <span class="val" id="overlapPadv">10</span>
        </div>
        <p class="effect" id="fx-flow"></p>
        <p class="effect" id="fx-align"></p>
        <p class="effect" id="fx-overlap"></p>
      </div>
    </div>

    <div class="trace">
      <div class="trace-head"><b>convergence</b><span id="trace-note"></span></div>
      <svg id="spark" viewBox="0 0 300 56" preserveAspectRatio="none" aria-label="Stress per epoch"></svg>
    </div>
  </section>

  <section class="stage">
    <div class="stage-head">
      <label for="engine" style="color:var(--dim)">compare with</label>
      <select id="engine" style="font-size:11px; padding:3px 6px">
        <option value="none">nothing</option>
        <option value="sugiyama">this repo's Sugiyama engine</option>
        <option value="mermaid">mermaid (dagre)</option>
      </select>
      <span id="cmpstat" style="color:var(--dim)"></span>
      <span class="spacer"></span>
      <span id="zoomlabel">100%</span>
      <button class="zoombtn" id="zin">+</button>
      <button class="zoombtn" id="zout">−</button>
      <button class="zoombtn" id="zfit">fit</button>
    </div>
    <div class="panes">
      <div class="pane">
        <span class="pane-tag" id="tag-a">stress / SGD</span>
        <div id="canvas" tabindex="0" role="img" aria-label="Rendered flowchart"></div>
      </div>
      <div class="pane" id="compare">
        <span class="pane-tag" id="tag-b">sugiyama</span>
        <div id="cmpview"></div>
      </div>
    </div>
    <div class="readout" id="readout"></div>
  </section>
</main>

<script>/* engine.js */
/* flowchart layout engine
   Sugiyama pipeline:
     1 cycle breaking      greedy FAS (Eades, Lin, Smyth 1993)
     2 layering            longest-path | Coffman-Graham | network simplex (GKNV 1993)
                           + optional node promotion (Nikolov & Tarassov 2006)
     3 ordering            weighted median (GKNV) + transpose, scored with
                           accumulator-tree crossing counting (Barth, Junger, Mutzel 2002)
     4 x-coordinates       Brandes & Kopf 2002, size-aware delta
     5 wrapping            cut-and-stack for aspect ratio (after Ruegg et al.)
     6 routing             polyline | orthogonal | spline
*/
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.FlowLayout = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * text measurement (injectable; browser overrides with canvas)
   * ------------------------------------------------------------------ */
  var measure = function (text, size, weight) {
    var w = 0;
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c >= 0x3000) w += 1.0;
      else if ('iljtfrI.,:;\'!|'.indexOf(text[i]) >= 0) w += 0.32;
      else if ('mwMW@'.indexOf(text[i]) >= 0) w += 0.92;
      else if (text[i] === text[i].toUpperCase() && /[A-Z]/.test(text[i])) w += 0.68;
      else w += 0.55;
    }
    return w * size * (weight >= 500 ? 1.04 : 1);
  };
  function setMeasurer(fn) { measure = fn; }

  /* ------------------------------------------------------------------ *
   * 0. parser  (mermaid-flavoured subset)
   * ------------------------------------------------------------------ */
  var SHAPES = [
    [/^\(\((.*)\)\)$/, 'circle'],
    [/^\(\[(.*)\]\)$/, 'stadium'],
    [/^\[\((.*)\)\]$/, 'cylinder'],
    [/^\{\{(.*)\}\}$/, 'hexagon'],
    [/^\[\/(.*)\/\]$/, 'parallelogram'],
    [/^\[\\(.*)\\\]$/, 'parallelogram'],
    [/^\{(.*)\}$/, 'diamond'],
    [/^\((.*)\)$/, 'round'],
    [/^\[(.*)\]$/, 'rect']
  ];
  /* A link is any run of dashes, equals or dots, optionally opened with `<` and closed
     with an arrowhead.  Mermaid lets you pad a link to make it span more ranks, so
     `-->`, `--->` and `----->` are the same link; matching a fixed set of three-character
     tokens silently dropped every padded edge. */
  var LINK_SRC = '<?(?:-\\.{1,3}-|\\.-|-\\.|-{2,}|={2,})[->ox]?';
  var EDGE_RE = new RegExp('(' + LINK_SRC + ')(?:\\s*\\|[^|]*\\|)?');
  /* the second label form: `A -- text --> B`.  Only a bare two-character opener starts
     one, which is what keeps `A --- B --- C` a pair of links rather than a label. */
  var INLINE_RE = new RegExp('^(\\s*)([^|]*?)\\s*(' + LINK_SRC + ')');

  function linkStyle(link) {
    if (link.indexOf('.') >= 0) return 'dashed';
    if (link.indexOf('=') >= 0) return 'thick';
    return 'solid';
  }
  function linkArrow(link) {
    return '>ox'.indexOf(link.charAt(link.length - 1)) >= 0 ? 'normal' : 'none';
  }

  /* Everything inside a node's brackets or quotes is label text, so a label reading
     "retry --> give up" must not be mistaken for a link.  Blank those spans out, match
     against the blanked copy, and slice the original by the index it reports.  The mask
     is the same length as the line so the indices line up. */
  function maskLabels(line) {
    var out = line.split(''), depth = 0, quote = null;
    for (var i = 0; i < out.length; i++) {
      var c = out[i];
      if (quote) { if (c === quote) quote = null; out[i] = ' '; continue; }
      if (depth > 0 && (c === '"' || c === "'")) { quote = c; out[i] = ' '; continue; }
      if (c === '[' || c === '(' || c === '{') { depth++; continue; }
      if (c === ']' || c === ')' || c === '}') { if (depth > 0) depth--; continue; }
      if (depth > 0) out[i] = ' ';
    }
    return out.join('');
  }

  function parseNodeRef(raw, nodes, order) {
    var s = raw.trim();
    if (!s) return null;
    var m = s.match(/^([A-Za-z0-9_.\u00c0-\uffff-]+)([\s\S]*)$/);
    if (!m) return null;
    var id = m[1], rest = m[2].trim(), shape = null, label = null;
    if (rest) {
      for (var i = 0; i < SHAPES.length; i++) {
        var mm = rest.match(SHAPES[i][0]);
        if (mm) { shape = SHAPES[i][1]; label = mm[1]; break; }
      }
      if (!shape) { shape = 'rect'; label = rest; }
    }
    if (!nodes[id]) { nodes[id] = { id: id, label: id, shape: 'rect' }; order.push(id); }
    if (label !== null) {
      nodes[id].label = label.replace(/^["']|["']$/g, '').replace(/<br\s*\/?>/gi, '\n');
      nodes[id].shape = shape;
    }
    return id;
  }

  function parseLine(line, lineNo, nodes, order, edges, errors) {
    var mask = maskLabels(line);
    var cursor = 0, prev = null, guard = 0;
    while (guard++ < 200) {
      var m = mask.slice(cursor).match(EDGE_RE);
      if (!m) {
        var tail = line.slice(cursor);
        if (tail.trim() && !parseNodeRef(tail, nodes, order)) {
          errors.push('line ' + lineNo + ': cannot read "' + tail.trim() + '"');
        }
        return;
      }
      var linkAt = cursor + m.index;
      var from = parseNodeRef(line.slice(cursor, linkAt), nodes, order) || prev;
      cursor = linkAt + m[0].length;

      var whole = line.substr(linkAt, m[0].length);
      var link = line.substr(linkAt, m[1].length);
      var piped = whole.match(/\|([^|]*)\|\s*$/);
      var label = piped ? piped[1].trim() : '';

      if (!label && /^(--|==|-\.)$/.test(link)) {
        var inline = mask.slice(cursor).match(INLINE_RE);
        if (inline) {
          label = line.substr(cursor + inline[1].length, inline[2].length).trim();
          link = inline[3];
          cursor += inline[0].length;
        }
      }

      var nextM = mask.slice(cursor).match(EDGE_RE);
      var rightEnd = nextM ? cursor + nextM.index : line.length;
      var to = parseNodeRef(line.slice(cursor, rightEnd), nodes, order);

      if (from && to) {
        edges.push({
          from: from, to: to,
          label: label.replace(/^["']|["']$/g, ''),
          style: linkStyle(link), arrow: linkArrow(link)
        });
      } else if (!from) {
        errors.push('line ' + lineNo + ': link "' + link + '" has nothing on its left');
      } else {
        errors.push('line ' + lineNo + ': link from "' + from + '" has no target');
      }

      prev = to;
      if (!nextM) return;
    }
  }

  function parse(src) {
    var nodes = {}, order = [], edges = [], dir = 'TB', errors = [];
    var lines = String(src).split(/\r?\n/);
    for (var li = 0; li < lines.length; li++) {
      var line = lines[li].replace(/%%.*$/, '').trim();
      if (!line) continue;
      var h = line.match(/^(?:flowchart|graph)\s+(TB|TD|BT|LR|RL)\s*$/i);
      if (h) { dir = h[1].toUpperCase() === 'TD' ? 'TB' : h[1].toUpperCase(); continue; }
      if (/^(subgraph|end|click|style|classDef|class|linkStyle)\b/i.test(line)) continue;

      for (var d = -freedom; d <= freedom; d++) {
        var idx = nominal + d;
        if (idx <= 0 || idx >= layerCount) continue;
        if (cuts.indexOf(idx) >= 0) continue;
        var score = spanCount[idx] + Math.abs(d) * 0.35;
        if (score < bestScore) { bestScore = score; best = idx; }
      }
      cuts.push(best);
    }
    return cuts.sort(function (a, b) { return a - b; });
  }

  /* ------------------------------------------------------------------ *
   * main layout
   * ------------------------------------------------------------------ */
  var DEFAULTS = {
    layering: 'network-simplex',   // longest-path | coffman-graham | network-simplex
    promote: true,
    cgWidth: 4,
    orderIters: 24,
    routing: 'orthogonal',         // orthogonal | polyline | spline
    dir: null,                     // overrides parsed direction
    nodeSep: 44,
    edgeSep: 16,
    rankSep: 56,
    fontSize: 14,
    edgeFontSize: 12,
    padX: 14,
    padY: 10,
    minW: 54,
    minH: 38,
    wrap: false,
    targetAR: 1.6,
    wrapGap: 56,
    cutFreedom: 2,
    cornerRadius: 8
  };

  function layout(graph, opts) {
    var t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var o = {};
    Object.keys(DEFAULTS).forEach(function (k) { o[k] = DEFAULTS[k]; });
    if (opts) Object.keys(opts).forEach(function (k) { if (opts[k] !== undefined) o[k] = opts[k]; });

    var nodes = graph.nodes.map(function (n) {
      return { id: n.id, label: n.label, shape: n.shape };
    });
    var edges = graph.edges.map(function (e, i) {
      return { id: 'e' + i, from: e.from, to: e.to, label: e.label || '', style: e.style, arrow: e.arrow };
    });
    var dir = o.dir || graph.dir || 'TB';

    sizeNodes(nodes, o);

    // LR/RL: lay out top-down on transposed boxes, then transpose back
    var horizontal = (dir === 'LR' || dir === 'RL');
    if (horizontal) nodes.forEach(function (n) { var t = n.w; n.w = n.h; n.h = t; });

    var ids = nodes.map(function (n) { return n.id; });
    if (!ids.length) {
      return { nodes: [], edges: [], width: 0, height: 0, stats: emptyStats(t0) };
    }

    /* 1 - cycles */
    greedyFAS(ids, edges);
    var dag = buildDag(ids, edges);

    /* 2 - layering */
    var layer;
    if (o.layering === 'longest-path') layer = longestPath(ids, dag);
    else if (o.layering === 'coffman-graham') layer = coffmanGraham(ids, dag, Math.max(1, o.cgWidth));
    else {
      var nsEdges = [];
      edges.forEach(function (e) {
        if (e.selfLoop) return;
        nsEdges.push({ t: e.reversed ? e.to : e.from, h: e.reversed ? e.from : e.to });
      });
      layer = networkSimplex(ids, dag, nsEdges, 80);
    }
    if (o.promote && o.layering !== 'coffman-graham') promote(ids, dag, layer);

    var hasEdgeLabels = edges.some(function (e) { return e.label && !e.selfLoop; });
    if (hasEdgeLabels) ids.forEach(function (v) { layer[v] *= 2; });
    var rankStep = hasEdgeLabels ? o.rankSep / 2 : o.rankSep;

    var maxLayer = 0;
    ids.forEach(function (v) { maxLayer = Math.max(maxLayer, layer[v]); });

    /* 3 - dummies */
    var proper = {};   // id -> {w,h,dummy,edgeId,label}
    nodes.forEach(function (n) { proper[n.id] = { w: n.w, h: n.h, dummy: false, real: n }; });
    var layerOf = {};
    ids.forEach(function (v) { layerOf[v] = layer[v]; });
    var dummyCount = 0;

    edges.forEach(function (e) {
      if (e.selfLoop) { e.chain = null; return; }
      var a = e.reversed ? e.to : e.from, b = e.reversed ? e.from : e.to;
      var la = layer[a], lb = layer[b];
      var chain = [a];
      var labelRank = hasEdgeLabels && e.label ? la + Math.max(1, Math.floor((lb - la) / 2)) : -1;
      for (var L = la + 1; L < lb; L++) {
        var did = '\u0001d' + e.id + '_' + L;
        var isLabel = (L === labelRank);
        var lw = 1, lh = 1;
        if (isLabel) {
          lw = Math.max(10, measure(e.label, o.edgeFontSize, 400) + 10);
          lh = o.edgeFontSize * 1.4;
        }
        proper[did] = { w: lw, h: lh, dummy: true, edgeId: e.id, isLabel: isLabel, labelText: isLabel ? e.label : '' };
        layerOf[did] = L; chain.push(did); dummyCount++;
      }
      chain.push(b);
      e.chain = chain;
      e.flip = e.reversed;
    });

    /* proper-graph adjacency */
    var adj = {}, adjUp = {}, adjDown = {};
    Object.keys(proper).forEach(function (v) { adj[v] = []; adjUp[v] = []; adjDown[v] = []; });
    var innerSeg = {};
    edges.forEach(function (e) {
      if (!e.chain) return;
      for (var i = 0; i + 1 < e.chain.length; i++) {
        var u = e.chain[i], v = e.chain[i + 1];
        if (layerOf[u] === layerOf[v]) continue;
        adjDown[u].push(v); adjUp[v].push(u);
        adj[u].push(v); adj[v].push(u);
        if (proper[u].dummy && proper[v].dummy) innerSeg[u + '\u0000' + v] = true;
      }
    });
    function isInner(u, v) { return !!innerSeg[u + '\u0000' + v]; }

    /* build layers, seeded by BFS for a decent starting order */
    var layers = [];
    for (var i = 0; i <= maxLayer; i++) layers.push([]);
    var seen = {}, queue = ids.filter(function (v) { return !dag.pred[v].length; });
    if (!queue.length) queue = [ids[0]];
    var seedOrder = [];
    while (queue.length) {
      var v0 = queue.shift();
      if (seen[v0]) continue;
      seen[v0] = true; seedOrder.push(v0);
      (dag.succ[v0] || []).forEach(function (w) { if (!seen[w]) queue.push(w); });
    }
    ids.forEach(function (v) { if (!seen[v]) seedOrder.push(v); });
    var placed = {};
    seedOrder.forEach(function (v) {
      layers[layerOf[v]].push(v); placed[v] = true;
      edges.forEach(function (e) {
        if (!e.chain) return;
        if (e.chain[0] !== v) return;
        e.chain.forEach(function (c) {
          if (!placed[c] && proper[c].dummy) { layers[layerOf[c]].push(c); placed[c] = true; }
        });
      });
    });
    Object.keys(proper).forEach(function (v) {
      if (!placed[v]) { layers[layerOf[v]].push(v); placed[v] = true; }
    });
    layers = layers.filter(function (L) { return L.length; });

    /* 4 - ordering */
    var ord = ordering(layers, adjUp, adjDown, o.orderIters);
    layers = ord.layers;

    /* 5 - coordinates */
    function sep(a, b) {
      var pa = proper[a], pb = proper[b];
      var gap = (pa.dummy || pb.dummy) ? o.edgeSep : o.nodeSep;
      return pa.w / 2 + pb.w / 2 + gap;
    }
    var xs = brandesKopf(layers, adj, adjUp, isInner, sep);

    var ys = [], acc = 0;
    layers.forEach(function (L, i) {
      var maxH = 0;
      L.forEach(function (v) { maxH = Math.max(maxH, proper[v].h); });
      if (i > 0) acc += rankStep;
      ys.push(acc + maxH / 2);
      acc += maxH;
    });

    var P = {};
    layers.forEach(function (L, i) {
      L.forEach(function (v) { P[v] = { x: xs[v], y: ys[i], layer: i, w: proper[v].w, h: proper[v].h }; });
    });

    /* 6 - wrapping */
    var chunkOf = {};
    layers.forEach(function (L, i) { L.forEach(function (v) { chunkOf[v] = 0; }); });
    var cuts = [], wrapBounds = null;
    if (o.wrap && layers.length > 2) {
      var spanCount = new Array(layers.length + 1).fill(0);
      edges.forEach(function (e) {
        if (!e.chain) return;
        var a = P[e.chain[0]], b = P[e.chain[e.chain.length - 1]];
        if (!a || !b) return;
        var lo = Math.min(a.layer, b.layer), hi = Math.max(a.layer, b.layer);
        for (var c = lo + 1; c <= hi; c++) spanCount[c]++;
      });
      var bestK = 1, bestErr = Infinity, bestCuts = [];
      var totalEdges = Math.max(1, edges.filter(function (e) { return e.chain; }).length);
      for (var k = 1; k <= Math.min(6, layers.length); k++) {
        var trial = chooseCuts(layers.length, spanCount, k, o.cutFreedom);
        var m = measureWrapped(layers, P, trial, o.wrapGap);
        // every severed edge becomes a long detour around the chunk, so cutting through
        // a busy layer has a real cost - weigh it against the ratio we gain
        var severed = trial.reduce(function (acc, c2) { return acc + (spanCount[c2] || 0); }, 0);
        var err = Math.abs(Math.log((m.w / Math.max(1, m.h)) / o.targetAR))
                + (severed / totalEdges) * 0.9;
        if (err < bestErr) { bestErr = err; bestK = k; bestCuts = trial; }
      }
      cuts = bestCuts;
      if (cuts.length) wrapBounds = applyWrap(layers, P, chunkOf, cuts, o.wrapGap);
    }

    /* 7 - assemble output */
    var outNodes = nodes.map(function (n) {
      var p = P[n.id];
      return {
        id: n.id, label: n.label, lines: n.lines, shape: n.shape,
        x: p.x, y: p.y, w: n.w, h: n.h, textDy: n.textDy || 0,
        layer: p.layer, chunk: chunkOf[n.id] || 0
      };
    });

    var outEdges = [], wrapLane = 0;
    edges.forEach(function (e) {
      if (e.selfLoop) {
        outEdges.push({
          id: e.id, from: e.from, to: e.to, label: e.label, style: e.style, arrow: e.arrow,
          selfLoop: true, points: [], labelPos: null
        });
        return;
      }
      var chain = e.flip ? e.chain.slice().reverse() : e.chain;
      var pts = chain.map(function (c) {
        return { x: P[c].x, y: P[c].y, chunk: chunkOf[c] || 0, layer: P[c].layer };
      });
      if (wrapBounds) {
        var routed = [pts[0]];
        for (var pi = 0; pi + 1 < pts.length; pi++) {
          if (pts[pi].chunk !== pts[pi + 1].chunk) {
            var det = detour(pts, pi, wrapBounds, wrapLane++, o.wrapGap);
            if (det) det.forEach(function (d) { routed.push(d); });
          }
          routed.push(pts[pi + 1]);
        }
        pts = routed;
      }
      var labelPos = null;
      chain.forEach(function (c) {
        if (proper[c] && proper[c].isLabel) labelPos = { x: P[c].x, y: P[c].y };
      });
      outEdges.push({
        id: e.id, from: e.from, to: e.to, label: e.label, style: e.style, arrow: e.arrow,
        reversed: e.reversed, points: pts, labelPos: labelPos, wrapped: pts.some(function (p, i) {
          return i > 0 && p.chunk !== pts[i - 1].chunk;
        })
      });
    });

    /* transpose back for LR/RL */
    if (horizontal) {
      outNodes.forEach(function (n) {
        var t = n.x; n.x = n.y; n.y = t;
        t = n.w; n.w = n.h; n.h = t;
      });
      outEdges.forEach(function (e) {
        e.points.forEach(function (p) { var t = p.x; p.x = p.y; p.y = t; });
        if (e.labelPos) { var t2 = e.labelPos.x; e.labelPos.x = e.labelPos.y; e.labelPos.y = t2; }
      });
    }
    if (dir === 'BT' || dir === 'RL') {
      var axis = (dir === 'BT') ? 'y' : 'x';
      outNodes.forEach(function (n) { n[axis] = -n[axis]; });
      outEdges.forEach(function (e) {
        e.points.forEach(function (p) { p[axis] = -p[axis]; });
        if (e.labelPos) e.labelPos[axis] = -e.labelPos[axis];
      });
    }

    /* normalise to origin */
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    outNodes.forEach(function (n) {
      minX = Math.min(minX, n.x - n.w / 2); maxX = Math.max(maxX, n.x + n.w / 2);
      minY = Math.min(minY, n.y - n.h / 2); maxY = Math.max(maxY, n.y + n.h / 2);
    });
    outEdges.forEach(function (e) {
      e.points.forEach(function (p) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      });
    });
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 0; maxY = 0; }
    var pad = 24;
    outNodes.forEach(function (n) { n.x = n.x - minX + pad; n.y = n.y - minY + pad; });
    outEdges.forEach(function (e) {
      e.points.forEach(function (p) { p.x = p.x - minX + pad; p.y = p.y - minY + pad; });
      if (e.labelPos) { e.labelPos.x = e.labelPos.x - minX + pad; e.labelPos.y = e.labelPos.y - minY + pad; }
    });

    var W = maxX - minX + pad * 2, H = maxY - minY + pad * 2;

    /* clip endpoints + build route geometry */
    var nodeById = {};
    outNodes.forEach(function (n) { nodeById[n.id] = n; });
    var flowVertical = !(dir === 'LR' || dir === 'RL');
    if (o.routing === 'polyline') {
      // polyline is the honest straight-line mode: aim at the target, clip on the outline
      outEdges.forEach(function (e) {
        if (e.selfLoop) return;
        var pts = e.points;
        var src = nodeById[e.from], dst = nodeById[e.to];
        pts[0] = clipToShape(src, pts[1] || { x: dst.x, y: dst.y });
        pts[pts.length - 1] = clipToShape(dst, pts[pts.length - 2] || { x: src.x, y: src.y });
        pts[0].layer = src.layer; pts[0].chunk = src.chunk; pts[0].nodeId = src.id;
        pts[pts.length - 1].layer = dst.layer; pts[pts.length - 1].chunk = dst.chunk;
        pts[pts.length - 1].nodeId = dst.id;
      });
    } else {
      assignPorts(outEdges, nodeById, flowVertical, Math.max(14, o.edgeSep + 8));
    }

    var chan = o.routing === 'orthogonal'
      ? assignChannels(outEdges, flowVertical ? 'y' : 'x', flowVertical ? 'x' : 'y',
                       Math.max(6, o.edgeSep * 0.6), 14)
      : null;

    outEdges.forEach(function (e) {
      if (e.selfLoop) { e.path = selfLoopPath(nodeById[e.from]); return; }
      var pts = e.points;
      e.path = buildPath(pts, o.routing, o.cornerRadius, flowVertical, chan, e.id);
      if (!e.labelPos && e.label) {
        var mid = pts[Math.floor(pts.length / 2)];
        var prev = pts[Math.max(0, Math.floor(pts.length / 2) - 1)];
        e.labelPos = { x: (mid.x + prev.x) / 2, y: (mid.y + prev.y) / 2 };
      }
    });

    var t1 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    return {
      nodes: outNodes, edges: outEdges, width: Math.round(W), height: Math.round(H),
      dir: dir,
      stats: {
        nodes: outNodes.length, edges: outEdges.length,
        layers: layers.length, dummies: dummyCount,
        crossings: ord.crossings,
        reversed: edges.filter(function (e) { return e.reversed; }).length,
        chunks: cuts.length + 1,
        width: Math.round(W), height: Math.round(H),
        ar: +(W / Math.max(1, H)).toFixed(2),
        ms: +(t1 - t0).toFixed(1)
      }
    };
  }

  function emptyStats(t0) {
    return { nodes: 0, edges: 0, layers: 0, dummies: 0, crossings: 0, reversed: 0,
             chunks: 1, width: 0, height: 0, ar: 0, ms: 0 };
  }

  function measureWrapped(layers, P, cuts, gap) {
    var chunkIdx = {}, c = 0;
    for (var i = 0; i < layers.length; i++) {
      if (cuts.indexOf(i) >= 0) c++;
      chunkIdx[i] = c;
    }
    var lo = {}, hi = {}, top = {}, bot = {};
    layers.forEach(function (L, i) {
      var ci = chunkIdx[i];
      L.forEach(function (v) {
        var p = P[v];
        lo[ci] = Math.min(lo[ci] === undefined ? Infinity : lo[ci], p.x - p.w / 2);
        hi[ci] = Math.max(hi[ci] === undefined ? -Infinity : hi[ci], p.x + p.w / 2);
        top[ci] = Math.min(top[ci] === undefined ? Infinity : top[ci], p.y - p.h / 2);
        bot[ci] = Math.max(bot[ci] === undefined ? -Infinity : bot[ci], p.y + p.h / 2);
      });
    });
    var w = 0, h = 0, n = Object.keys(lo).length;
    Object.keys(lo).forEach(function (k) {
      w += hi[k] - lo[k];
      h = Math.max(h, bot[k] - top[k]);
    });
    w += gap * (n - 1);
    return { w: w, h: h };
  }

  function applyWrap(layers, P, chunkOf, cuts, gap) {
    var chunkIdx = {}, c = 0;
    for (var i = 0; i < layers.length; i++) {
      if (cuts.indexOf(i) >= 0) c++;
      chunkIdx[i] = c;
    }
    var lo = {}, hi = {}, top = {}, bot = {};
    layers.forEach(function (L, i) {
      var ci = chunkIdx[i];
      L.forEach(function (v) {
        var p = P[v];
        lo[ci] = Math.min(lo[ci] === undefined ? Infinity : lo[ci], p.x - p.w / 2);
        hi[ci] = Math.max(hi[ci] === undefined ? -Infinity : hi[ci], p.x + p.w / 2);
        top[ci] = Math.min(top[ci] === undefined ? Infinity : top[ci], p.y - p.h / 2);
        bot[ci] = Math.max(bot[ci] === undefined ? -Infinity : bot[ci], p.y + p.h / 2);
      });
    });
    var offX = {}, run = 0;
    var keys = Object.keys(lo).map(Number).sort(function (a, b) { return a - b; });
    keys.forEach(function (k) {
      offX[k] = run - lo[k];
      run += (hi[k] - lo[k]) + gap;
    });
    var baseTop = top[keys[0]];
    layers.forEach(function (L, i) {
      var ci = chunkIdx[i];
      L.forEach(function (v) {
        P[v].x += offX[ci];
        P[v].y -= (top[ci] - baseTop);
        chunkOf[v] = ci;
      });
    });
    // bounds in final (post-translation) space, for routing wrapped edges around chunks
    var bounds = {};
    keys.forEach(function (k) {
      bounds[k] = {
        left: lo[k] + offX[k], right: hi[k] + offX[k],
        top: baseTop, bottom: bot[k] - (top[k] - baseTop)
      };
    });
    return bounds;
  }

  /* An edge that crosses a cut must not be drawn straight through the gap - it has to
     leave the bottom of one chunk, cross the gutter, and come back in at the top of the
     next.  Each wrapped edge gets its own lane so they do not stack on top of each other. */
  function detour(pts, i, bounds, lane, gap) {
    var a = pts[i], b = pts[i + 1];
    var ca = bounds[a.chunk], cb = bounds[b.chunk];
    if (!ca || !cb) return null;
    var forward = b.chunk > a.chunk;
    var off = lane * 7;
    var exitY = ca.bottom + 18 + off;
    var enterY = cb.top - 18 - off;
    var gutter = forward
      ? (ca.right + cb.left) / 2 + (off - gap / 4)
      : (cb.right + ca.left) / 2 + (off - gap / 4);
    return [
      { x: a.x, y: exitY, chunk: a.chunk, hard: true },
      { x: gutter, y: exitY, chunk: a.chunk, hard: true },
      { x: gutter, y: enterY, chunk: b.chunk, hard: true },
      { x: b.x, y: enterY, chunk: b.chunk, hard: true }
    ];
  }

  /* ------------------------------------------------------------------ *
   * geometry
   * ------------------------------------------------------------------ */
  /* How far along the ray (dx,dy) from the centre the outline sits, for shapes whose
     silhouette is a polygon.  Points are centre-relative, in order. */
  function rayToPolygon(dx, dy, pts) {
    var best = Infinity;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], q = pts[(i + 1) % pts.length];
      var ex = q[0] - p[0], ey = q[1] - p[1];
      var den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      var t = (p[0] * ey - p[1] * ex) / den;
      var u = (p[0] * dy - p[1] * dx) / den;
      if (t > 0 && u >= 0 && u <= 1) best = Math.min(best, t);
    }
    return isFinite(best) ? best : 1;
  }

  /* A cylinder is a box with an elliptical cap dished into each end, so near the left
     and right of the top face the outline sits well below the bounding box.  Clipping
     to the box there leaves the arrow floating in the gap. */
  function rayToCylinder(dx, dy, hw, hh, e) {
    var tSide = Math.abs(hw / (dx || 1e-9));
    if (Math.abs(dy * tSide) <= hh - e) return tSide;
    var c = (dy < 0 ? -1 : 1) * (hh - e);
    var A = (dx * dx) / (hw * hw) + (dy * dy) / (e * e);
    var B = -2 * dy * c / (e * e);
    var C = (c * c) / (e * e) - 1;
    var disc = B * B - 4 * A * C;
    if (disc < 0) return tSide;
    var root = (-B + Math.sqrt(disc)) / (2 * A);
    return root > 0 ? root : tSide;
  }

  function clipToShape(n, toward) {
    var dx = toward.x - n.x, dy = toward.y - n.y;
    if (dx === 0 && dy === 0) return { x: n.x, y: n.y + n.h / 2 };
    var hw = n.w / 2, hh = n.h / 2, t, k;
    if (n.shape === 'circle' || n.shape === 'stadium' || n.shape === 'round') {
      t = 1 / Math.sqrt((dx * dx) / (hw * hw) + (dy * dy) / (hh * hh));
      if (n.shape !== 'circle') {
        var tr = Math.min(Math.abs(hw / (dx || 1e-9)), Math.abs(hh / (dy || 1e-9)));
        t = (t + tr) / 2;
      }
    } else if (n.shape === 'diamond') {
      t = 1 / (Math.abs(dx) / hw + Math.abs(dy) / hh);
    } else if (n.shape === 'cylinder') {
      t = rayToCylinder(dx, dy, hw, hh, Math.min(12, n.h / 4));
    } else if (n.shape === 'hexagon') {
      k = Math.min(18, n.w / 5);
      t = rayToPolygon(dx, dy, [[-hw + k, -hh], [hw - k, -hh], [hw, 0],
                                [hw - k, hh], [-hw + k, hh], [-hw, 0]]);
    } else if (n.shape === 'parallelogram') {
      k = Math.min(18, n.w / 5);
      t = rayToPolygon(dx, dy, [[-hw + k, -hh], [hw, -hh], [hw - k, hh], [-hw, hh]]);
    } else {
      t = Math.min(Math.abs(hw / (dx || 1e-9)), Math.abs(hh / (dy || 1e-9)));
    }
    return { x: n.x + dx * t, y: n.y + dy * t, chunk: toward.chunk };
  }

  /* Geometric clipping sends an edge out of whichever point on the outline lies on the
     straight line to its target - which for a box means it can leave through a corner and
     arrive at a corner, and several edges converging on one node all land on the same spot.
     Real orthogonal routers attach to the face perpendicular to the flow and spread the
     attachment points along it.  That is what this does. */
  var SPREAD = {
    rect: 0.66, round: 0.6, stadium: 0.5, diamond: 0.5,

    s.push('<defs><marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" ' +
           'markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">' +
           '<path d="M0 0 L10 5 L0 10 z" fill="' + t.edge + '"/></marker></defs>');
    if (flat) s.push('<rect x="0" y="0" width="' + L.width + '" height="' + L.height + '" fill="#ffffff"/>');

    // edges first so nodes sit on top
    L.edges.forEach(function (e) {
      var dash = e.style === 'dashed' ? ' stroke-dasharray="6 4"' : '';
      var sw = e.style === 'thick' ? 2.6 : 1.5;
      var head = e.arrow === 'none' ? '' : ' marker-end="url(#fl-arrow)"';
      s.push('<path ' + (flat ? '' : 'class="fl-edge" data-id="' + esc(e.id) + '" ') +
             'd="' + e.path + '" fill="none" stroke="' + t.edge + '" stroke-width="' + sw +
             '" stroke-linecap="round" stroke-linejoin="round"' + dash + head + '/>');
    });

    L.edges.forEach(function (e) {
      if (!e.label || !e.labelPos) return;
      var w = e.label.length * efs * 0.58 + 10, h = efs * 1.5;
      s.push('<rect x="' + f(e.labelPos.x - w / 2) + '" y="' + f(e.labelPos.y - h / 2) +
             '" width="' + f(w) + '" height="' + f(h) + '" rx="3" fill="' + t.edgeLabelBg +
             '" stroke="none"/>');
      s.push('<text x="' + f(e.labelPos.x) + '" y="' + f(e.labelPos.y) +
             '" text-anchor="middle" dominant-baseline="central" font-family="' + ff +
             '" font-size="' + efs + '" fill="' + t.edgeLabel + '">' + esc(e.label) + '</text>');
    });

    L.nodes.forEach(function (n) {
      var g = shapeGeom(n);
      var fill = n.shape === 'diamond' ? t.accentFill : t.nodeFill;
      var stroke = n.shape === 'diamond' ? t.accentStroke : t.nodeStroke;
      if (!flat) s.push('<g class="fl-node" data-id="' + esc(n.id) + '">');
      s.push(shapeSVG(n, g, fill, stroke, 1.5));
      s.push(nodeText(n, t.text, fs, ff));
      if (!flat) s.push('</g>');
    });

    s.push('</svg>');
    return s.join('\n');
  }

  /* ------------------------------------------------------------------ *
   * draw.io / diagrams.net  mxGraphModel
   * ------------------------------------------------------------------ */
  var DRAWIO_STYLE = {
    rect: 'rounded=0;whiteSpace=wrap;html=1;',
    round: 'rounded=1;whiteSpace=wrap;html=1;arcSize=20;',
    stadium: 'rounded=1;whiteSpace=wrap;html=1;arcSize=50;',
    diamond: 'rhombus;whiteSpace=wrap;html=1;',
    circle: 'ellipse;whiteSpace=wrap;html=1;',
    cylinder: 'shape=cylinder3;whiteSpace=wrap;html=1;boundedLbl=1;backgroundOutline=1;size=12;',
    hexagon: 'shape=hexagon;whiteSpace=wrap;html=1;perimeter=hexagonPerimeter2;',
    parallelogram: 'shape=parallelogram;perimeter=parallelogramPerimeter;whiteSpace=wrap;html=1;'
  };

  function toDrawio(L, opts) {
    var o = opts || {};
    var routing = o.routing || 'orthogonal';
    var edgeStyle = routing === 'orthogonal' ? 'edgeStyle=orthogonalEdgeStyle;rounded=1;'
                  : routing === 'spline' ? 'edgeStyle=none;curved=1;rounded=0;'
                  : 'edgeStyle=none;rounded=0;';
    var x = [];
    x.push('<mxfile host="flowchart-lab" modified="' + new Date().toISOString() +
           '" agent="flowchart-lab" version="21.0.0" type="device">');
    x.push('  <diagram id="flowchart-lab-1" name="Flowchart">');
    x.push('    <mxGraphModel dx="' + (L.width + 200) + '" dy="' + (L.height + 200) +
           '" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" ' +
           'page="1" pageScale="1" pageWidth="850" pageHeight="1100" math="0" shadow="0">');
    x.push('      <root>');
    x.push('        <mxCell id="0" />');
    x.push('        <mxCell id="1" parent="0" />');

    var idMap = {};
    L.nodes.forEach(function (n, i) {
      var cid = 'node' + i;
      idMap[n.id] = cid;
      var style = DRAWIO_STYLE[n.shape] || DRAWIO_STYLE.rect;
      if (n.shape === 'diamond') style += 'fillColor=#eef2f9;strokeColor=#2f6fd0;';
      else style += 'fillColor=#ffffff;strokeColor=#3f4650;';
      style += 'fontSize=13;fontColor=#12161c;';
      x.push('        <mxCell id="' + cid + '" value="' + esc(String(n.label).replace(/\n/g, '<br>')) +
             '" style="' + style + '" vertex="1" parent="1">');
      x.push('          <mxGeometry x="' + f(n.x - n.w / 2) + '" y="' + f(n.y - n.h / 2) +
             '" width="' + f(n.w) + '" height="' + f(n.h) + '" as="geometry" />');
      x.push('        </mxCell>');
    });

    L.edges.forEach(function (e, i) {
      var st = edgeStyle + 'html=1;strokeColor=#5a626e;fontSize=11;fontColor=#3f4650;';
      if (e.style === 'dashed') st += 'dashed=1;';
      if (e.style === 'thick') st += 'strokeWidth=2.5;';
      if (e.arrow === 'none') st += 'endArrow=none;';
      var src = idMap[e.from], dst = idMap[e.to];
      x.push('        <mxCell id="edge' + i + '" value="' + esc(e.label || '') + '" style="' + st +
             '" edge="1" parent="1" source="' + src + '" target="' + dst + '">');
      x.push('          <mxGeometry relative="1" as="geometry">');
      // interior waypoints preserve the computed route exactly
      var mids = (e.points || []).slice(1, -1);
      if (mids.length && !e.selfLoop) {
        x.push('            <Array as="points">');
        mids.forEach(function (p) {
          x.push('              <mxPoint x="' + f(p.x) + '" y="' + f(p.y) + '" />');
        });
        x.push('            </Array>');
      }
      x.push('          </mxGeometry>');
      x.push('        </mxCell>');
    });

    x.push('      </root>');
    x.push('    </mxGraphModel>');
    x.push('  </diagram>');
    x.push('</mxfile>');
    return x.join('\n');
  }

  return { toSVG: toSVG, toDrawio: toDrawio, shapeGeom: shapeGeom, esc: esc };
});

<script>/* lab-ui.js */
/* UI shared by both workbenches.

   The renderer, pan/zoom, gutter, readout and clipboard export are the same whichever
   engine produced the layout: both engines return the same {nodes, edges, width,
   height, stats} shape, so none of this needs to know which one ran.  It lives here
   rather than in each app file because the last time two copies of this code existed
   they drifted, and a fix landed in only one of them.
*/
(function (root) {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';

  /* shared drawing state: the live <svg>, its pan/zoom transform, and the element
     cache that lets a redraw move existing shapes instead of rebuilding them */
  var view = {k:1, x:0, y:0};
  var last = null, prevStats = null, dom = {nodes:{}, edges:{}}, svgEl = null, rootG = null;

  function setLayout(L){ prevStats = last ? last.stats : null; last = L; }
  function current(){ return last; }
  function reset(){
    Object.keys(dom.nodes).forEach(function(k){ dom.nodes[k].remove(); });
    Object.keys(dom.edges).forEach(function(k){ dom.edges[k].remove(); });
    dom.nodes = {}; dom.edges = {};
    last = null; prevStats = null;
  }

var PRESETS = {
approval:`flowchart TD
  A[New request] --> B{Complete?}
  B -->|no| R[/Return to sender/]
  B -->|yes| C[Assign reviewer]
  C --> D{Under $10k?}
  D -->|yes| E[Auto-approve]
  D -->|no| F[Committee review]
  F --> G{Approved?}
  G -->|no| R
  G -->|yes| E
  E --> H[(Write to ledger)]
  H --> I((Done))
  R --> I`,

chain:`flowchart TD
  s((Intake)) --> n1[Validate schema]
  n1 --> n2[Normalise fields]
  n2 --> n3[Deduplicate]
  n3 --> n4[Enrich from CRM]
  n4 --> n5[Score risk]
  n5 --> n6[Apply policy]
  n6 --> n7[Reserve funds]
  n7 --> n8[Notify customer]
  n8 --> n9[Settle]
  n9 --> n10[Reconcile]
  n10 --> n11[Archive]
  n11 --> e((Complete))`,

crossy:`flowchart TD
  a1[Ingest A] --> b3[Queue C]
  a2[Ingest B] --> b2[Queue B]
  a3[Ingest C] --> b1[Queue A]
  a1 --> b1
  a3 --> b3
  b1 --> c2[Worker 2]
  b2 --> c1[Worker 1]
  b3 --> c3[Worker 3]
  c1 --> d2[(Shard 2)]
  c2 --> d1[(Shard 1)]
  c3 --> d2`,

state:`flowchart TD
  idle((Idle)) --> run[Running]
  run --> chk{Healthy?}
  chk -->|yes| run
  chk -->|no| back[Back off]
  back -.-> run
  back --> giveup{Attempts left?}
  giveup -->|yes| back
  giveup -->|no| dead[/Dead letter/]
  run ==> done((Complete))
  dead --> idle`,

incident:`flowchart TD
  a((Alert fires)) --> b[Page on-call]
  b --> c{Acknowledged in 5m?}
  c -->|no| d[Escalate to secondary]
  d --> c
  c -->|yes| e[Open incident channel]
  e --> f[Declare severity]
  f --> g{Sev 1 or 2?}
  g -->|yes| h[Notify incident commander]
  g -->|no| i[Assign single responder]
  h --> j[Start comms timer]
  i --> k[Begin triage]
  j --> k
  k --> l{Customer impact?}
  l -->|yes| m[Post status page update]
  l -->|no| n[Log internal only]
  m --> o[Gather signals]
  n --> o
  o --> p[(Pull metrics)]
  o --> q[(Pull traces)]
  o --> r[(Pull recent deploys)]
  p --> s2[Form hypothesis]
  q --> s2
  r --> s2
  s2 --> t{Recent deploy suspect?}
  t -->|yes| u[Roll back release]
  t -->|no| v[Inspect dependencies]
  u --> w{Recovered?}
  v --> x{Upstream degraded?}
  x -->|yes| y[Fail over region]
  x -->|no| z[Deep dive logs]
  y --> w
  z --> aa{Root cause found?}
  aa -->|no| s2
  aa -->|yes| ab[Apply mitigation]
  ab --> w
  w -->|no| ac{Time budget left?}
  ac -->|yes| s2
  ac -->|no| ad[Engage vendor support]
  ad --> w
  w -->|yes| ae[Monitor 30 minutes]
  ae --> af{Stable?}
  af -->|no| s2
  af -->|yes| ag[Post all-clear]
  ag --> ah[Close status page]
  ah --> ai[Schedule postmortem]
  ai --> aj[Draft timeline]
  aj --> ak[Identify action items]
  ak --> al[(File follow-up tickets)]
  al --> am[Review in weekly]
  am --> an((Incident closed))`,

wide:`flowchart TD
  R[Dispatcher] --> A1[Region NA]
  R --> A2[Region EU]
  R --> A3[Region APAC]
  R --> A4[Region LATAM]
  R --> A5[Region MEA]
  A1 --> Z[(Aggregate)]
  A2 --> Z
  A3 --> Z
  A4 --> Z
  A5 --> Z
  Z --> O((Report))`
};

/* ---------- render ---------- */
function el(t,a){ var e=document.createElementNS(NS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }

function ensureSvg(){
  if (svgEl) return;
  svgEl = el('svg',{xmlns:NS});
  var defs = el('defs');
  // namespaced: a bare id here collides with the controls in the markup, and a
  // url(#id) that resolves to an <input> paints no arrowhead at all
  var m = el('marker',{id:'fl-arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',
    markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse',markerUnits:'strokeWidth'});
  m.appendChild(el('path',{d:'M0 0 L10 5 L0 10 z',fill:'#5a626e'}));
  defs.appendChild(m); svgEl.appendChild(defs);
  rootG = el('g'); svgEl.appendChild(rootG);
  $('canvas').appendChild(svgEl);
}

function shapeNode(n){
  var g = FlowExport.shapeGeom({x:0,y:0,w:n.w,h:n.h,shape:n.shape});
  var fill = n.shape==='diamond' ? '#eef2f9' : '#ffffff';
  var stroke = n.shape==='diamond' ? '#2f6fd0' : '#3f4650';
  var parts=[];
  if (g.kind==='rect') parts.push(el('rect',{x:g.x,y:g.y,width:g.w,height:g.h,rx:g.rx,ry:g.rx,fill:fill,stroke:stroke,'stroke-width':1.5}));
  else if (g.kind==='ellipse') parts.push(el('ellipse',{cx:g.cx,cy:g.cy,rx:g.rx,ry:g.ry,fill:fill,stroke:stroke,'stroke-width':1.5}));
  else if (g.kind==='poly') parts.push(el('polygon',{points:g.pts.map(function(p){return p[0]+','+p[1];}).join(' '),fill:fill,stroke:stroke,'stroke-width':1.5}));
  else { parts.push(el('path',{d:g.d,fill:fill,stroke:stroke,'stroke-width':1.5}));
         if(g.cap) parts.push(el('path',{d:g.cap,fill:'none',stroke:stroke,'stroke-width':1.5})); }
  var lines = n.lines||[n.label], lh = 14*1.32;
  var t = el('text',{x:0,y:(n.textDy||0)-((lines.length-1)*lh)/2,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'ui-sans-serif, system-ui, sans-serif','font-size':14,'font-weight':500,fill:'#161a1f'});
  lines.forEach(function(l,i){
    var ts = el('tspan',{x:0}); if(i) ts.setAttribute('dy',lh);
    ts.textContent = l; t.appendChild(ts);
  });
  parts.push(t);
  return parts;
}

function render(L){
  ensureSvg();
  var seenN={}, seenE={};

  L.edges.forEach(function(e){
    seenE[e.id]=1;
    var p = dom.edges[e.id];
    if(!p){
      p = el('path',{class:'fl-edge',fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});
      rootG.appendChild(p); dom.edges[e.id]=p;
    }
    p.setAttribute('d', e.path);
    p.setAttribute('stroke', '#5a626e');
    p.setAttribute('stroke-width', e.style==='thick'?2.6:1.5);
    if(e.style==='dashed') p.setAttribute('stroke-dasharray','6 4'); else p.removeAttribute('stroke-dasharray');
    if(e.arrow==='none') p.removeAttribute('marker-end'); else p.setAttribute('marker-end','url(#fl-arrow)');
  });

  L.edges.forEach(function(e){
    if(!e.label||!e.labelPos) return;
    var id='lbl_'+e.id; seenE[id]=1;
    var g = dom.edges[id];
    if(!g){
      g = el('g',{class:'fl-edge'});
      g.appendChild(el('rect',{rx:3,fill:'#f4f2ed'}));
      var t=el('text',{'text-anchor':'middle','dominant-baseline':'central',
        'font-family':'ui-sans-serif, system-ui, sans-serif','font-size':12,fill:'#3f4650'});
      g.appendChild(t); rootG.appendChild(g); dom.edges[id]=g;
    }
    var txt=g.lastChild; txt.textContent=e.label;
    var w=e.label.length*7+10, h=18;
    g.firstChild.setAttribute('x',-w/2); g.firstChild.setAttribute('y',-h/2);
    g.firstChild.setAttribute('width',w); g.firstChild.setAttribute('height',h);
    g.setAttribute('transform','translate('+e.labelPos.x+','+e.labelPos.y+')');
  });

  L.nodes.forEach(function(n){
    seenN[n.id]=1;
    var g = dom.nodes[n.id];
    var sig = n.shape+'|'+n.w+'|'+n.h+'|'+(n.textDy||0)+'|'+(n.lines||[]).join('\u0001');
    if(!g || g.dataset.sig!==sig){
      if(g) g.remove();
      g = el('g',{class:'fl-node'}); g.dataset.sig=sig;
      shapeNode(n).forEach(function(p){ g.appendChild(p); });
      rootG.appendChild(g); dom.nodes[n.id]=g;
    }
    g.setAttribute('transform','translate('+n.x+','+n.y+')');
  });

  Object.keys(dom.nodes).forEach(function(k){ if(!seenN[k]){ dom.nodes[k].remove(); delete dom.nodes[k]; }});
  Object.keys(dom.edges).forEach(function(k){ if(!seenE[k]){ dom.edges[k].remove(); delete dom.edges[k]; }});
}

/* ---------- readout ---------- */
function readout(metrics, s, prevStats){
  var box=$('readout');
  if(!box.children.length){
    metrics.forEach(function(m){
      var d=document.createElement('div');
      d.className='metric'+(m.lead?' lead':'');
      d.innerHTML='<span class="k">'+m.k+'</span><span class="v" data-v></span><span class="d" data-d></span>';
      box.appendChild(d);
    });
  }
  metrics.forEach(function(m,i){
    var cell=box.children[i];
    var v=m.get(s);
    cell.querySelector('[data-v]').textContent=v;
    var dEl=cell.querySelector('[data-d]');
    if(m.text||!prevStats){ dEl.className='d'; dEl.textContent=''; return; }
    var was=m.get(prevStats), diff=v-was;
    // a float metric such as stress otherwise shows its full binary expansion here
    diff = Math.round(diff*100)/100;
    if(Math.abs(diff) < 0.005){ dEl.className='d'; dEl.textContent=''; return; }
    var better = m.lower ? diff<0 : diff>0;
    dEl.className='d on '+(better?'down':'up');
    dEl.textContent=(diff>0?'+':'')+diff;
  });
}

/* ---------- pan / zoom ---------- */
function applyView(){
  if(!rootG) return;
  rootG.setAttribute('transform','translate('+view.x+','+view.y+') scale('+view.k+')');
  $('zoomlabel').textContent=Math.round(view.k*100)+'%';
}
function fit(){
  if(!last) return;
  var c=$('canvas'), cw=c.clientWidth, ch=c.clientHeight;
  if(!cw||!ch) return;
  var k=Math.min(cw/(last.width+40), ch/(last.height+40), 1.6);
  view.k=k; view.x=(cw-last.width*k)/2; view.y=(ch-last.height*k)/2;
  applyView();
}
function zoomBy(f, cx, cy){
  var c=$('canvas');
  cx = cx===undefined ? c.clientWidth/2 : cx;
  cy = cy===undefined ? c.clientHeight/2 : cy;
  var nk=Math.max(0.1, Math.min(4, view.k*f));
  view.x = cx-(cx-view.x)*(nk/view.k);
  view.y = cy-(cy-view.y)*(nk/view.k);
  view.k=nk; applyView();
}
(function(){
  var c=$('canvas'), dragging=false, sx=0, sy=0, ox=0, oy=0;
  c.addEventListener('pointerdown',function(e){
    dragging=true; sx=e.clientX; sy=e.clientY; ox=view.x; oy=view.y;
    c.classList.add('drag'); c.setPointerCapture(e.pointerId);
  });
  c.addEventListener('pointermove',function(e){
    if(!dragging) return;
    view.x=ox+(e.clientX-sx); view.y=oy+(e.clientY-sy); applyView();
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    c.addEventListener(ev,function(){ dragging=false; c.classList.remove('drag'); });
  });
  c.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=c.getBoundingClientRect();
    zoomBy(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);
  },{passive:false});
  c.addEventListener('keydown',function(e){
    var step=40;
    if(e.key==='ArrowLeft'){view.x+=step;applyView();e.preventDefault();}
    if(e.key==='ArrowRight'){view.x-=step;applyView();e.preventDefault();}
    if(e.key==='ArrowUp'){view.y+=step;applyView();e.preventDefault();}
    if(e.key==='ArrowDown'){view.y-=step;applyView();e.preventDefault();}
    if(e.key==='0'){fit();e.preventDefault();}
  });
  $('zin').onclick=function(){zoomBy(1.2);};
  $('zout').onclick=function(){zoomBy(1/1.2);};
  $('zfit').onclick=fit;
})();

/* ---------- gutter ---------- */
function syncGutter(){
  var ta=$('src'), n=ta.value.split('\n').length, g=$('gutter'), out=[];
  for(var i=1;i<=n;i++) out.push(i);
  g.textContent=out.join('\n');
  g.scrollTop=ta.scrollTop;
}

/* ---------- export ---------- */
function flash(btn,msg){
  if(btn.dataset.restore) clearTimeout(+btn.dataset.restore);
  else btn.dataset.label = btn.textContent;
  btn.textContent = msg;
  btn.dataset.restore = setTimeout(function(){
    btn.textContent = btn.dataset.label; delete btn.dataset.restore;
  },1300);
}

/* Chrome's async clipboard only accepts text/plain, text/html and image/png natively;
   image/svg+xml is refused outright. Anything else has to travel as a "web " custom
   format, which only web apps that opt in can read. So the payload always goes on
   text/plain, which is what draw.io's Edit Diagram box, editors, and paste-as-text all
   read, and the typed copy rides along for whatever can use it. */
function copyOut(btn, text, webType){
  function attempt(withTyped){
    if (!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) {
      return navigator.clipboard && navigator.clipboard.writeText
        ? navigator.clipboard.writeText(text) : Promise.reject();
    }
    var reps = {'text/plain': new Blob([text], {type:'text/plain'})};
    if (withTyped && webType) reps[webType] = new Blob([text], {type:webType});
    try { return navigator.clipboard.write([new ClipboardItem(reps)]); }
    catch (e) { return Promise.reject(e); }
  }
  // Chrome parks a clipboard write until the document regains focus, so the promise can
  // sit pending forever and the button would never say anything. Cap the wait and let
  // the synchronous fallback take over; writing the same text twice is harmless.
  var settled = false;
  function guard(p){
    return new Promise(function(res, rej){
      p.then(function(v){ if(!settled){ settled=true; res(v); } },
             function(e){ if(!settled){ settled=true; rej(e); } });
      setTimeout(function(){ if(!settled){ settled=true; rej(new Error('clipboard timeout')); } }, 1200);
    });
  }
  guard(attempt(true).catch(function(){ return attempt(false); }))
    .then(function(){ flash(btn,'copied'); })
    .catch(function(){
      var ta=document.createElement('textarea');
      ta.value=text; ta.style.cssText='position:fixed;top:-1000px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); flash(btn,'copied'); }
      catch(e){ flash(btn,'copy failed'); }
      ta.remove();
    });
}

$('ex-drawio').onclick=function(){
  if(!last) return;
  copyOut(this, FlowExport.toDrawio(last,{routing:$('routing').value}), 'web application/xml');
};
$('ex-office').onclick=function(){
  if(!last) return;
  copyOut(this, FlowExport.toSVG(last,{mode:'flat'}), 'web image/svg+xml');
};
$('ex-svg').onclick=function(){
  if(!last) return;
  copyOut(this, FlowExport.toSVG(last,{mode:'app'}), 'web image/svg+xml');
};

  root.LabUI = {
    PRESETS: PRESETS, NS: NS, el: el,
    ensureSvg: ensureSvg, render: render, readout: readout,
    applyView: applyView, fit: fit, zoomBy: zoomBy, view: view, dom: dom,
    syncGutter: syncGutter, copyOut: copyOut, flash: flash,
    reset: reset, setLayout: setLayout, current: current
  };
})(this);
</script>
<script>/* sgd-engine.js */
/* stress layout by stochastic gradient descent
