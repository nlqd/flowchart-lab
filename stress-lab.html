        var p = segs[i], q = segs[j];
        if (p.from === q.from || p.from === q.to || p.to === q.from || p.to === q.to) continue;
        var d1 = side(p.x1, p.y1, p.x2, p.y2, q.x1, q.y1);
        var d2 = side(p.x1, p.y1, p.x2, p.y2, q.x2, q.y2);
        var d3 = side(q.x1, q.y1, q.x2, q.y2, p.x1, p.y1);
        var d4 = side(q.x1, q.y1, q.x2, q.y2, p.x2, p.y2);
        if (d1 * d2 < 0 && d3 * d4 < 0) c++;
      }
    }
    return c;
  }

  /* ------------------------------------------------------------------ *
   * layout: same output shape as the Sugiyama engine, so the renderer and
   * both exporters work against either one unchanged
   * ------------------------------------------------------------------ */
  var DEFAULTS = {
    optimiser: 'sgd',     // sgd | majorization | fr | snap
    epochs: 30,
    epsilon: 0.1,
    seed: 1,
    edgeLength: 110,      // pixels per hop of graph distance
    flow: 'none',         // none | TB | LR
    flowGap: 70,
    overlapPad: 10,
    align: true,
    alignTol: 90,
    removeOverlaps: true
  };

  function layout(graph, opts, deps) {
    var t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var o = {};
    Object.keys(DEFAULTS).forEach(function (k) { o[k] = DEFAULTS[k]; });
    if (opts) Object.keys(opts).forEach(function (k) { if (opts[k] !== undefined) o[k] = opts[k]; });

    var host = deps || (typeof FlowLayout !== 'undefined' ? FlowLayout : null);
    if (!host) throw new Error('SGDLayout.layout needs FlowLayout for node sizing and clipping');

    var nodes = graph.nodes.map(function (n) {
      return { id: n.id, label: n.label, shape: n.shape };
    });
    var edges = graph.edges.map(function (e, i) {
      return { id: 'e' + i, from: e.from, to: e.to, label: e.label || '', style: e.style, arrow: e.arrow };
    });
    host.sizeNodes(nodes, host.DEFAULTS);
    var n = nodes.length;
    if (!n) {
      return { nodes: [], edges: [], width: 0, height: 0, dir: o.flow,
               stats: { nodes: 0, edges: 0, stress: 0, crossings: 0, overlaps: 0,
                        diameter: 0, epochs: 0, width: 0, height: 0, ar: 0, ms: 0 } };
    }

    var idx = {}, i;
    for (i = 0; i < n; i++) idx[nodes[i].id] = i;
    var adj = [];
    for (i = 0; i < n; i++) adj.push([]);
    var selfLoops = {};
    edges.forEach(function (e) {
      var a = idx[e.from], b = idx[e.to];
      if (a === undefined || b === undefined) return;
      if (a === b) { selfLoops[e.id] = true; return; }
      adj[a].push(b); adj[b].push(a);
    });

    var d = allPairs(n, adj);
    var comp = bridgeComponents(d, n);
    // scale hop distance into pixels up front so every later stage works in one unit.
    // Stress is unaffected: w_ij = d_ij^-2 cancels the squared residual exactly.
    for (i = 0; i < n * n; i++) d[i] *= o.edgeLength;

    /* Rüegg et al. run the layout three times, adding constraints as they go: untangle
       first, then add flow while overlaps are still allowed so nodes can float past
       each other and swap, and only then separate the boxes.  Applying non-overlap
       any earlier freezes whatever ordering the first pass happened to land on. */
    var res;
    if (o.optimiser === 'majorization') {
      res = majorize(d, n, { epochs: o.epochs, seed: o.seed });
    } else if (o.optimiser === 'fr') {
      res = fruchtermanReingold(n, adj, { epochs: Math.max(40, o.epochs * 10), seed: o.seed, ideal: o.edgeLength });
    } else if (o.optimiser === 'snap') {
      var elist = [];
      edges.forEach(function (e) {
        var a = idx[e.from], b = idx[e.to];
        if (a !== undefined && b !== undefined && a !== b) elist.push([a, b]);
      });
      res = snapTFDP(n, elist, { epochs: Math.max(20, o.epochs * 2), seed: o.seed, ideal: o.edgeLength });
    } else {
      res = run(d, n, { epochs: o.epochs, epsilon: o.epsilon, seed: o.seed });
    }
    var trace = res.trace.slice();
    for (i = 0; i < n; i++) { nodes[i].x = res.X[2 * i]; nodes[i].y = res.X[2 * i + 1]; }

    /* Two constraint sets, and satisfying one can break the other: pushing boxes
       apart moves a node back across the ordering that flow just imposed.  Alternate
       the projections until neither has anything left to do.  This is the usual
       alternating-projection fix, and on these graphs it settles in a couple of
       rounds. */
    var wantFlow = (o.flow === 'TB' || o.flow === 'LR');
    var flowAxis = o.flow === 'TB' ? 'y' : 'x';
    var flowInfo = null, overlapInfo = null;

    if (wantFlow) {
      // stage two: flow settles while boxes may still overlap.  Each round projects
      // onto the ordering, then lets a damped run of the optimiser pull the drawing
      // back toward low stress, which is what lets a node slide past its neighbour.
      var relax = [];
      for (i = 0; i < 4; i++) relax.push(o.edgeLength * o.edgeLength * Math.pow(0.35, i + 1));
      for (var r = 0; r < 3; r++) {
        flowInfo = enforceFlow(nodes, edges, { axis: flowAxis, gap: o.flowGap }, host);
        var cur = new Float64Array(2 * n);
        for (i = 0; i < n; i++) { cur[2 * i] = nodes[i].x; cur[2 * i + 1] = nodes[i].y; }
        var refine = (o.optimiser === 'majorization')
          ? majorize(d, n, { init: cur, epochs: 2, seed: o.seed + 101 + r })
          : (o.optimiser === 'sgd'
              ? run(d, n, { init: cur, etas: relax, seed: o.seed + 101 + r })
              : { X: cur, trace: [] });   // fr and snap have no constrained resume
        for (i = 0; i < n; i++) { nodes[i].x = refine.X[2 * i]; nodes[i].y = refine.X[2 * i + 1]; }
        trace = trace.concat(refine.trace.map(function (t, k) {
          return { epoch: trace.length + k, eta: t.eta, stress: t.stress };
        }));
      }
      flowInfo = enforceFlow(nodes, edges, { axis: flowAxis, gap: o.flowGap }, host);
      if (o.align) alignEdges(nodes, edges, { axis: flowAxis, tol: o.alignTol }, host);
    }

    /* Stage three: separate the boxes.  The two projections can undo one another, so
       alternate, and always finish on non-overlap the way the paper orders it: boxes
       sitting on top of each other read far worse than an edge that leans the wrong
       way, and any edge still leaning is counted honestly below. */
    var rounds = (wantFlow && o.removeOverlaps) ? 6 : 1;
    for (var pass = 0; pass < rounds; pass++) {
      if (wantFlow && pass > 0) flowInfo = enforceFlow(nodes, edges, { axis: flowAxis, gap: o.flowGap }, host);
      overlapInfo = o.removeOverlaps
        ? removeOverlaps(nodes, { pad: o.overlapPad })
        : { passes: 0, overlapsLeft: countOverlaps(nodes, 0), travel: 0 };
      if (!wantFlow || overlapInfo.travel < 0.5) break;
    }
    // count violations against the final positions, not against a mid-pipeline snapshot
    var backward = null;
    if (wantFlow) {
      var pos = {};
      nodes.forEach(function (nd) { pos[nd.id] = nd; });
      backward = 0;
      edges.forEach(function (e) {
        if (e.from === e.to) return;
        var a = pos[e.from], b = pos[e.to];
        if (a && b && b[flowAxis] <= a[flowAxis] + 0.5) backward++;
      });
    }

    var byId = {};
    nodes.forEach(function (nd) { byId[nd.id] = nd; });

    var outEdges = edges.map(function (e) {
      var a = byId[e.from], b = byId[e.to];
      var out = { id: e.id, from: e.from, to: e.to, label: e.label, style: e.style,
                  arrow: e.arrow, selfLoop: !!selfLoops[e.id], points: [], labelPos: null, path: '' };
      if (!a || !b) return out;
      if (out.selfLoop) {
        var r = Math.max(18, a.h * 0.42), cx = a.x + a.w / 2, cy = a.y;
        out.path = 'M' + f(cx) + ' ' + f(cy - r * 0.4) +
                   'C' + f(cx + r * 1.7) + ' ' + f(cy - r * 1.2) + ' ' +
                         f(cx + r * 1.7) + ' ' + f(cy + r * 1.2) + ' ' +
                         f(cx) + ' ' + f(cy + r * 0.4);
        return out;
      }
      var p0 = host.clipToShape(a, { x: b.x, y: b.y });
      var p1 = host.clipToShape(b, { x: a.x, y: a.y });
      out.points = [{ x: p0.x, y: p0.y }, { x: p1.x, y: p1.y }];
      out.path = 'M' + f(p0.x) + ' ' + f(p0.y) + 'L' + f(p1.x) + ' ' + f(p1.y);
      if (e.label) out.labelPos = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
      return out;
    });

    var segs = outEdges.filter(function (e) { return !e.selfLoop && e.points.length === 2; })
      .map(function (e) {
        return { from: e.from, to: e.to,
                 x1: e.points[0].x, y1: e.points[0].y, x2: e.points[1].x, y2: e.points[1].y };
      });
    var crossings = countCrossings(segs);

    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(function (nd) {
      minX = Math.min(minX, nd.x - nd.w / 2); maxX = Math.max(maxX, nd.x + nd.w / 2);
      minY = Math.min(minY, nd.y - nd.h / 2); maxY = Math.max(maxY, nd.y + nd.h / 2);
    });
    var pad = 24;
    nodes.forEach(function (nd) { nd.x = nd.x - minX + pad; nd.y = nd.y - minY + pad; });
    outEdges.forEach(function (e) {
      e.points.forEach(function (pt) { pt.x = pt.x - minX + pad; pt.y = pt.y - minY + pad; });
      if (e.labelPos) { e.labelPos.x = e.labelPos.x - minX + pad; e.labelPos.y = e.labelPos.y - minY + pad; }
      if (e.points.length === 2) {
        e.path = 'M' + f(e.points[0].x) + ' ' + f(e.points[0].y) +
                 'L' + f(e.points[1].x) + ' ' + f(e.points[1].y);
      } else if (e.selfLoop) {
        var a = byId[e.from];
        var r = Math.max(18, a.h * 0.42), cx = a.x + a.w / 2, cy = a.y;
        e.path = 'M' + f(cx) + ' ' + f(cy - r * 0.4) +
                 'C' + f(cx + r * 1.7) + ' ' + f(cy - r * 1.2) + ' ' +
                       f(cx + r * 1.7) + ' ' + f(cy + r * 1.2) + ' ' +
                       f(cx) + ' ' + f(cy + r * 0.4);
      }
    });

    var W = maxX - minX + pad * 2, H = maxY - minY + pad * 2;
    // report the stress of what is actually drawn, after every constraint pass
    var finalX = new Float64Array(2 * n);
    for (i = 0; i < n; i++) { finalX[2 * i] = nodes[i].x; finalX[2 * i + 1] = nodes[i].y; }
    var stressNow = stress(finalX, d, n);
    var t1 = (typeof performance !== 'undefined' ? performance.now() : Date.now());

    return {
      nodes: nodes.map(function (nd) {
        return { id: nd.id, label: nd.label, lines: nd.lines, shape: nd.shape,
                 x: nd.x, y: nd.y, w: nd.w, h: nd.h, textDy: nd.textDy || 0,
                 layer: 0, chunk: 0 };
      }),
      edges: outEdges,
      width: Math.round(W), height: Math.round(H), dir: o.flow,
      trace: trace,
      stats: {
        nodes: n, edges: outEdges.length,
        stress: +stressNow.toFixed(2),
        crossings: crossings,
        overlaps: countOverlaps(nodes, 0),
        diameter: comp.diameter,
        epochs: o.epochs,
        optimiser: o.optimiser,
        backward: backward,
        width: Math.round(W), height: Math.round(H),
        ar: +(W / Math.max(1, H)).toFixed(2),
        ms: +(t1 - t0).toFixed(1)
      }
    };
  }

  function f(v) { return Math.round(v * 100) / 100; }

  return {
    _rng: rng, allPairs: allPairs, bridgeComponents: bridgeComponents,
    stress: stress, schedule: schedule, run: run,
    removeOverlaps: removeOverlaps, countOverlaps: countOverlaps,
    enforceFlow: enforceFlow, alignEdges: alignEdges, countCrossings: countCrossings,
    layout: layout, DEFAULTS: DEFAULTS,
    majorize: majorize, fruchtermanReingold: fruchtermanReingold, snapTFDP: snapTFDP
  };
});
</script>
<script>/* sgd-app.js */
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var U = LabUI, PRESETS = U.PRESETS;
var syncGutter = U.syncGutter, fit = U.fit, applyView = U.applyView;

/* text metrics from the canvas, so both workbenches size boxes identically */
var mc = (function(){
  try { return document.createElement('canvas').getContext('2d'); } catch(e){ return null; }
})();
if (mc && typeof mc.measureText === 'function') {
  FlowLayout.setMeasurer(function(text, size, weight){
    mc.font = (weight>=500?'500 ':'400 ') + size + 'px ui-sans-serif, system-ui, -apple-system, sans-serif';
    return mc.measureText(text).width;
  });
}

var METRICS = [
  {k:'stress',    get:function(s){return s.stress;},    lower:true, lead:true},
  {k:'crossings', get:function(s){return s.crossings;}, lower:true},
  {k:'overlaps',  get:function(s){return s.overlaps;},  lower:true},
  {k:'backward',  get:function(s){return s.backward===null?'—':s.backward;}, text:true},
  {k:'diameter',  get:function(s){return s.diameter;},  text:true},
  {k:'size',      get:function(s){return s.width+'×'+s.height;}, text:true},
  {k:'ratio',     get:function(s){return s.ar.toFixed(2);}, text:true},
  {k:'time',      get:function(s){return s.ms+'ms';}, text:true}
];

function opts(){
  return {
    optimiser: $('optimiser').value,
    epochs: +$('epochs').value,
    edgeLength: +$('edgeLength').value,
    seed: +$('seed').value,
    flow: $('flow').value,
    flowGap: +$('flowGap').value,
    align: $('align').checked,
    overlapPad: +$('overlapPad').value,
    removeOverlaps: $('noOverlap').checked
  };
}

/* ---------- convergence trace ---------- */
function drawSpark(trace){
  var svg = $('spark');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (!trace || trace.length < 2){
    $('trace-note').textContent = 'not reported by this method';
    return;
  }
  var W = 300, H = 56, pad = 3;
  var vals = trace.map(function(t){ return t.stress; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  // stress spans orders of magnitude across a run, so a log scale is the only way
  // the tail of the curve stays visible next to the first few epochs
  var f = function(v){ return Math.log(Math.max(v, 1e-6) + 1); };
  var flo = f(lo), fhi = f(hi), span = (fhi - flo) || 1;
  var pts = vals.map(function(v,i){
    var x = pad + (i/(vals.length-1)) * (W - pad*2);
    var y = pad + (1 - (f(v)-flo)/span) * (H - pad*2);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var area = U.el('polygon',{points:pad+','+(H-pad)+' '+pts.join(' ')+' '+(W-pad)+','+(H-pad),
    fill:'rgba(95,179,122,0.13)', stroke:'none'});
  var line = U.el('polyline',{points:pts.join(' '), fill:'none', stroke:'#5fb37a',
    'stroke-width':1.4, 'stroke-linejoin':'round', 'vector-effect':'non-scaling-stroke'});
  svg.appendChild(area); svg.appendChild(line);
  $('trace-note').textContent = vals.length + ' epochs, ' + hi.toFixed(1) + ' \u2192 ' + lo.toFixed(2);
}

/* ---------- what each control does ---------- */
function setFx(id, text){ var e=$(id); if(e){ e.textContent=text||''; e.className='effect'; } }
var OPT_FX = {
  sgd: 'Zheng, Pawar & Goodman, Algorithm 1. Visits every vertex pair once per epoch '
     + 'and moves only the two vertices involved. No solver, and no guarantee that any '
     + 'single epoch lowers stress.',
  majorization: 'The same stress objective, solved by relocating one vertex at a time to '
     + 'the weighted average its neighbours want. Every sweep is guaranteed to lower '
     + 'stress, which SGD cannot promise. Compare the two curves on your own graph.',
  fr: 'Fruchterman-Reingold, 1991. Pulls along edges, pushes everything else apart, and '
    + 'never computes graph distance at all, so the stress reading here is a score it was '
    + 'never trying to win.',
  snap: 'SNAP-tFDP (IEEE VIS 2026). Walks the edge list and pushes each tail away from a '
      + 'few random non-neighbours, so degree weighting falls out of the sampling. Also '
      + 'ignores graph distance, and its forces are bounded at short range.'
};

function updateEffects(L){
  var t = L.trace || [];
  setFx('fx-optimiser', OPT_FX[$('optimiser').value] || '');
  var settleAt = -1;
  if (t.length > 2){
    var fin = t[t.length-1].stress;
    for (var i=0;i<t.length;i++){ if (t[i].stress <= fin*1.02){ settleAt = i; break; } }
  }
  setFx('fx-epochs', settleAt >= 0
    ? 'Stress is within 2% of its final value by epoch ' + settleAt + '; the rest is polish.'
    : (t.length ? 'Each epoch visits every vertex pair once, in a fresh random order.'
                : 'This method reports no per-epoch stress, so the trace below stays empty.'));

  setFx('fx-seed', 'The optimiser starts from a random layout. Changing the seed finds a '
    + 'different local minimum, which is the honest way to see how stable this graph is.');

  setFx('fx-flow', $('flow').value === 'none'
    ? 'Pure stress: nothing tells the drawing which way an edge points, so it will not read top to bottom.'
    : (L.stats.backward
        ? L.stats.backward + ' edge(s) still point backwards. Those sit on cycles, and no ordering can satisfy them.'
        : 'Every edge points along the flow axis.'));

  setFx('fx-align', !$('align').checked
    ? 'Off. Stress wants two nodes k hops apart to sit k hop-lengths apart in a straight '
    + 'line; the flow gap only supplies part of that vertically, so the rest leaks into x '
    + 'and a deep chain shears into a diagonal.'
    : 'Edges already close to vertical are merged into a shared column, after Rüegg et al.\u2019s '
    + 'alignment step. It straightens short chains. It does not rescue a deep one: see the '
    + 'Sugiyama pane for what a layered pipeline does with the same graph.');

  setFx('fx-overlap', !$('noOverlap').checked
    ? 'Off. The stress model treats a node as a point, so boxes will sit on top of each other.'
    : (L.stats.overlaps
        ? L.stats.overlaps + ' pair(s) still overlap; raise the box gap or the hop length.'
        : 'No two boxes overlap.'));
}

function showErr(m){ var e=$('err'); e.textContent=m; e.className='errbar'+(m?' on':''); }

/* ---------- run ---------- */
var timer=null, firstRun=true;
function run(immediate){
  clearTimeout(timer);
  timer=setTimeout(function(){
    var g;
    try { g = FlowLayout.parse($('src').value); }
    catch(err){ showErr('parse failed: '+err.message); return; }
    var L;
    try { L = SGDLayout.layout(g, opts(), FlowLayout); }
    catch(err){ showErr('layout failed: '+err.message); return; }
    showErr(g.errors.length ? g.errors.join('\n') : '');
    var prev = U.current() ? U.current().stats : null;
    U.setLayout(L);
    U.render(L);
    U.readout(METRICS, L.stats, prev);
    drawSpark(L.trace);
    updateEffects(L);
    if($('engine').value!=='none') renderCompare();
    if(firstRun){ firstRun=false; requestAnimationFrame(fit); }
  }, immediate?0:180);
}

/* ---------- wiring ---------- */
['optimiser','flow','noOverlap','align'].forEach(function(id){
  $(id).addEventListener('change',function(){ run(true); });
});
[['epochs','epochsv'],['edgeLength','edgeLengthv'],['seed','seedv'],
 ['flowGap','flowGapv'],['overlapPad','overlapPadv']].forEach(function(p){
  $(p[0]).addEventListener('input',function(){ $(p[1]).textContent=$(p[0]).value; run(); });
});
$('src').addEventListener('input',function(){ syncGutter(); run(); });
$('src').addEventListener('scroll',function(){ $('gutter').scrollTop=$('src').scrollTop; });
$('src').addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault();
    var s=this.selectionStart, en=this.selectionEnd;
    this.value=this.value.slice(0,s)+'  '+this.value.slice(en);
    this.selectionStart=this.selectionEnd=s+2; syncGutter(); run();
  }
});
$('preset').addEventListener('change',function(){
  $('src').value=PRESETS[this.value];
  syncGutter(); firstRun=true; run(true);
});

/* ---------- comparison pane ---------- */
var mermaidMod = null, cmpToken = 0;

function cmpMsg(title, detail){
  var box = $('cmpview');
  box.textContent = '';
  var d = document.createElement('div');
  d.className = 'cmp-msg';
  if (title){ var b = document.createElement('b'); b.textContent = title; d.appendChild(b); }
  if (detail){ d.appendChild(document.createTextNode(detail)); }
  box.appendChild(d);
}

function renderCompare(){
  var mode = $('engine').value;
  var pane = $('compare');
  if (mode === 'none'){ pane.classList.remove('on'); $('cmpstat').textContent = ''; return; }
  pane.classList.add('on');
  $('tag-b').textContent = mode === 'sugiyama' ? 'sugiyama (this repo)' : 'mermaid + dagre';

  if (mode === 'sugiyama'){
    // the interesting comparison: same source, same box sizes, same renderer.
    // The only difference is which engine placed the nodes.
    var g, L;
    try { g = FlowLayout.parse($('src').value); L = FlowLayout.layout(g, {routing:'orthogonal'}); }
    catch(err){ cmpMsg('Sugiyama engine failed', String(err && err.message || err).slice(0,200)); return; }
    var box = $('cmpview');
    box.textContent = '';
    var holder = document.createElement('div');
    holder.style.cssText = 'width:100%;height:100%';
    holder.innerHTML = FlowExport.toSVG(L, {mode:'app'});   // our own escaped output
    box.appendChild(holder);
    var svg = box.querySelector('svg');
    if (svg){
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
      svg.style.maxWidth='none'; svg.style.width='100%'; svg.style.height='100%';
    }
    $('cmpstat').textContent = L.stats.width + '\u00d7' + L.stats.height +
      '  ratio ' + L.stats.ar.toFixed(2) + '  ' + L.stats.crossings + ' crossings  ' + L.stats.ms + 'ms';
    return;
  }

  var token = ++cmpToken;
  var src = $('src').value;
  cmpMsg('', 'loading mermaid\u2026');
  var p = mermaidMod ? Promise.resolve(mermaidMod)
    : import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs').then(function(m){
        mermaidMod = m.default || m;
        mermaidMod.initialize({ startOnLoad:false, theme:'base', securityLevel:'loose',
          flowchart:{ htmlLabels:false },
          themeVariables:{ background:'#f4f2ed', primaryColor:'#ffffff',
            primaryBorderColor:'#3f4650', primaryTextColor:'#161a1f',
            lineColor:'#5a626e', fontSize:'14px',
            fontFamily:'ui-sans-serif, system-ui, sans-serif' } });
        return mermaidMod;
      });
  p.then(function(mm){
    if (token !== cmpToken) return;
    var t0 = performance.now();
    return mm.render('cmp'+token, src).then(function(res){
      if (token !== cmpToken) return;
      var ms = (performance.now()-t0).toFixed(0);
      $('cmpview').innerHTML = res.svg;
      var s2 = $('cmpview').querySelector('svg');
      if (s2){
        s2.removeAttribute('width'); s2.removeAttribute('height');
        s2.setAttribute('preserveAspectRatio','xMidYMid meet');
        s2.style.maxWidth='none';
        var vb = (s2.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
        var w = vb[2]?Math.round(vb[2]):0, h = vb[3]?Math.round(vb[3]):0;
        $('cmpstat').textContent = w&&h ? w+'\u00d7'+h+'  ratio '+(w/h).toFixed(2)+'  '+ms+'ms' : ms+'ms';
      }
    });
  }).catch(function(err){
    if (token !== cmpToken) return;
    var offline = /Failed to fetch|dynamically imported|NetworkError|Importing/i.test(String(err && err.message));
    $('cmpstat').textContent='';
    if (offline) cmpMsg('Could not reach jsdelivr',
      'mermaid is fetched from a CDN, so this pane needs a network connection. Everything on the left runs offline.');
    else cmpMsg('mermaid could not render this', String(err && err.message || err).slice(0,200));
  });
}

$('engine').addEventListener('change', function(){
  if (this.value === 'none'){ $('compare').classList.remove('on'); $('cmpstat').textContent=''; }
  else renderCompare();
  requestAnimationFrame(fit);
});

/* ---------- export ---------- */
$('ex-drawio').onclick=function(){
  if(!U.current()) return;
  U.copyOut(this, FlowExport.toDrawio(U.current(),{routing:'polyline'}), 'web application/xml');
};
$('ex-office').onclick=function(){
  if(!U.current()) return;
  U.copyOut(this, FlowExport.toSVG(U.current(),{mode:'flat'}), 'web image/svg+xml');
};
$('ex-svg').onclick=function(){
  if(!U.current()) return;
  U.copyOut(this, FlowExport.toSVG(U.current(),{mode:'app'}), 'web image/svg+xml');
};

window.addEventListener('resize',function(){ if(U.current() && firstRun===false) applyView(); });

/* ---------- boot ---------- */
$('src').value=PRESETS.approval;
syncGutter();
run(true);
})();
</script>
